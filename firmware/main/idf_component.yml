dependencies:
  idf: ">=5.5"
  espressif/led_strip: "3.1.1"
  # LVGL 9 и обвязка под esp_lcd: версии закреплены, чтобы сборка на GitHub была такой же, как у нас
  lvgl/lvgl: "9.4.0"
  espressif/esp_lvgl_port: "2.7.2"
  # WebSocket-клиент для связи с ноутбуком (docs/PROTOCOL.md). Версия закреплена: сборка на GitHub такая же, как у нас
  espressif/esp_websocket_client: "1.7.0"
  # Слово «Джарвис» на самой плате (WakeNet9 wn9_jarvis_tts) и детектор конца речи (VAD): ESP-SR. Версия закреплена
  espressif/esp-sr: "2.6.1"
  # Второй движок слова: microWakeWord (TFLite Micro), своя модель «Джарвис» (main/models). Версии закреплены как у ESPHome:
  # тот же стек, на котором модель проверена. esp-nn (быстрые ядра для ESP32-S3) закреплён явно, а не «как выберет esp-tflite-micro»
  espressif/esp-tflite-micro: "1.4.1"
  espressif/esp-nn: "1.4.2"
  esphome/esp-micro-speech-features: "1.2.3"
